[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ship-traffic-mvp"
version = "0.1.0"
description = "Daily ship traffic and port activity reporting with IMF PortWatch and Google Workspace delivery."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
google = [
  "google-api-python-client>=2.160,<3",
  "google-auth>=2.38,<3",
]
test = ["pytest>=8.3,<9"]

[project.scripts]
ship-traffic = "ship_traffic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

