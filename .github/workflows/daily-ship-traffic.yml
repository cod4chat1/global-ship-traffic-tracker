name: Daily ship traffic update

"on":
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-ship-traffic-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      SHIP_TRAFFIC_SKIP_WORKBOOK: "1"
      SHIP_TRAFFIC_DATABASE: state/ship_traffic.sqlite3
      SHIP_TRAFFIC_OUTPUT_DIR: artifacts/daily
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Verify tracker
        run: python -m unittest discover -s tests -v

      - name: Update Google Sheet and Drive snapshot
        run: >-
          python -m ship_traffic.cli run
          --provider portwatch
          --date "$(date -u +%F)"
          --history-days 45
          --google

      - name: Keep run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ship-traffic-${{ github.run_id }}
          path: artifacts/daily/
          retention-days: 14
          if-no-files-found: warn

      - name: Send GitHub completion alert
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          RUN_RESULT_PATH: artifacts/daily/run_result.json
        with:
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const jobSucceeded = process.env.JOB_STATUS === "success";
            let runResult = null;
            let invalidResult = null;
            if (jobSucceeded) {
              try {
                runResult = JSON.parse(
                  fs.readFileSync(process.env.RUN_RESULT_PATH, "utf8")
                );
              } catch (error) {
                invalidResult = `Could not read run result: ${error.message}`;
              }

              if (runResult?.status === "no_new_data") {
                core.info(
                  `No new PortWatch data after ${runResult.report_date}; no alert sent.`
                );
                return;
              }
              if (runResult?.status !== "new_data") {
                invalidResult =
                  invalidResult || `Unexpected run status: ${runResult?.status}`;
              }
            }

            const succeeded = jobSucceeded && !invalidResult;
            const icon = succeeded ? "[OK]" : "[FAILED]";
            const outcome = succeeded ? "completed successfully" : "failed";
            const runUrl =
              `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const sheetUrl =
              `https://docs.google.com/spreadsheets/d/${process.env.SPREADSHEET_ID}/edit`;
            const timestamp = new Date().toISOString();
            const body = [
              `@${owner} The daily ship-traffic update **${outcome}**.`,
              "",
              `- Time: ${timestamp}`,
              ...(succeeded
                ? [`- New observation date: ${runResult.report_date}`]
                : []),
              ...(invalidResult ? [`- Validation: ${invalidResult}`] : []),
              `- [Workflow run](${runUrl})`,
              `- [Ship traffic dashboard](${sheetUrl})`,
            ].join("\n");

            try {
              await github.rest.issues.getLabel({
                owner, repo, name: "daily-update-alerts"
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: "daily-update-alerts",
                color: "1D76DB",
                description: "Automated daily tracker notifications",
              });
            }

            const existing = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: "daily-update-alerts",
              per_page: 1,
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.data[0].number,
                body: `${icon} ${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: "Daily ship traffic update alerts",
                body: `${icon} ${body}\n\nKeep this issue open and subscribed to receive daily alerts.`,
                labels: ["daily-update-alerts"],
              });
            }

            if (invalidResult) {
              core.setFailed(invalidResult);
            }
